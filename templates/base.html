{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FCA PRIME CARS{% endblock %}</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260818-responsive">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "veiculos/partials/header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}?v=20260818-responsive" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</body>
</html>
